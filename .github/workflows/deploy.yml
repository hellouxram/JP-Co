name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Switch to `npm ci` once package-lock.json is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # Configure in: Settings → Secrets and variables → Actions → Variables
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://www.jpandcotech.com' }}
          # Domain verified 2026-11-27 (www.jpandcotech.com serves this site). Override with an Actions variable if needed.
          VITE_SITE_URL_VERIFIED: ${{ vars.VITE_SITE_URL_VERIFIED || 'true' }}
          VITE_CONTACT_FORM_ENDPOINT: ${{ vars.VITE_CONTACT_FORM_ENDPOINT }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
