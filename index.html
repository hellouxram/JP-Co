<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JP &amp; Co. — Technology built with purpose</title>
    <meta
      name="description"
      content="JP &amp; Co. is a founder-led technology company offering AI and workflow automation, product design and UX, SaaS and software engineering, and product strategy."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1F3B" media="(prefers-color-scheme: dark)" />
    <!-- Apply the saved or system theme before first paint (prevents a flash of the wrong theme). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('jp-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <meta name="robots" content="index, follow" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / Twitter. Absolute og:url, og:image and the canonical link are
         injected at build time ONLY when VITE_SITE_URL_VERIFIED=true (see scripts/postbuild-seo.mjs). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JP &amp; Co." />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="JP &amp; Co. — Technology built with purpose" />
    <meta
      property="og:description"
      content="JP &amp; Co. is a founder-led technology company offering AI and workflow automation, product design and UX, SaaS and software engineering, and product strategy."
    />
    <meta property="og:image" content="/og-image-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JP &amp; Co. — Technology Company. Built on vision. Driven by innovation." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JP &amp; Co. — Technology built with purpose" />
    <meta
      name="twitter:description"
      content="JP &amp; Co. is a founder-led technology company offering AI and workflow automation, product design and UX, SaaS and software engineering, and product strategy."
    />
    <meta name="twitter:image" content="/og-image-1200x630.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Pages are pre-rendered; without JavaScript, show scroll-reveal content immediately. -->
    <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
