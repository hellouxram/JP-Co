name: Export plain HTML

# Builds the React source and publishes framework-free HTML/CSS to the `static-export` branch.
# The plain-HTML `main` branch is then updated from that output (it is not overwritten automatically).
on:
  push:
    branches: [react-source]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SITE_URL_VERIFIED: 'true'
      - run: node scripts/export-static.mjs
      - name: Push static-export branch
        run: |
          cd static-site
          git init -q -b static-export
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Static HTML export of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" static-export
